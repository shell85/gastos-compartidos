name: Supabase + frontend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install frontend dependencies
        run: npm install

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database from migrations + seed
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run real API concurrency tests
        run: node scripts/test-supabase-concurrency.mjs

      - name: Postgres lint
        run: supabase db lint
